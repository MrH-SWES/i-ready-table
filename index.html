    row.appendChild(grip);
    enableDrag(row, grip);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'note-delete';
    del.setAttribute('aria-label', 'delete note');
    del.textContent = '×';
    del.addEventListener('pointerdown', event => { event.preventDefault(); event.stopPropagation(); });
    del.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      row.remove();
      if (!document.querySelector('.row')) {
        const mf = makeRow('');
        setActive(mf);
      } else if (activeField && activeField.closest('.row') === row) {
        const mf = document.querySelector('math-field');
        setActive(mf);
      }
      scheduleSave();
    });
    row.appendChild(del);

    const mf = document.createElement('math-field');
    mf.setAttribute('virtual-keyboard-mode', 'manual');
    mf.setAttribute('math-virtual-keyboard-policy', 'manual');
    mf.setAttribute('smart-fence', 'true');
    mf.setAttribute('smart-mode', 'true');
    mf.setAttribute('letter-shape-style', 'tex');
    mf.setAttribute('default-mode', 'math');
    mf.value = latex;

    mf.addEventListener('focusin', () => setActive(mf));
    mf.addEventListener('pointerdown', () => setActive(mf));
    mf.addEventListener('input', scheduleSave);
    mf.addEventListener('keydown', (event) => {
      if (event.key === '/') {
        // Let MathLive handle physical-keyboard slash.
        // Its native behavior turns the expression immediately before the caret
        // into the numerator and places the caret in the denominator.
        // Our old custom insert fired too, creating a nested blank fraction:
        // 2 / -> \frac{2}{\frac{□}{□}}.
        return;
      }
      if (event.key === ' ') {
        event.preventDefault();
        insertSpace();
      }
      if (event.key === 'Enter') {
        event.preventDefault();
        newLineAfter(mf);
      }
    });

    row.appendChild(mf);
    stage.appendChild(row);
    return mf;
  }

  function setActive(mf) {
    if (!mf) return;
    activeCell = null;
    clearActiveCell();
    activeField = mf;
    document.querySelectorAll('.row').forEach(row => row.classList.remove('active'));
    document.querySelectorAll('.algo-holder').forEach(h => h.classList.remove('active'));
    mf.closest('.row').classList.add('active');
  }

  function focusActive() {
    if (!activeField) activeField = document.querySelector('math-field') || makeRow();
    setActive(activeField);
    activeField.focus({ preventScroll: true });
    return activeField;
  }

  function insertLatex(latex) {
    const mf = focusActive();
    try {
      mf.executeCommand(['insert', latex]);
    } catch (err) {
      try { mf.insert(latex); } catch (ignored) {}
    }
    scheduleSave();
  }

  function insertText(text) {
    if (activeCell && /^[0-9.]$/.test(text)) { insertIntoCell(text); return; }
    insertLatex(text);
  }

  function moveAfterParentIfPossible(mf) {
    try { mf.executeCommand('moveAfterParent'); } catch (ignored) {}
  }

  function insertSpace() {
    const mf = focusActive();
    // Space is used as the natural "I am done with this fraction" gesture.
    // If the caret is inside a numerator/denominator, this pops it out first.
    moveAfterParentIfPossible(mf);
    insertLatex('\\,');
  }

  function insertFraction() {
    const mf = focusActive();
    // Always add a thin math space before a fraction. This makes mixed numbers
    // like 7 1/2 work without requiring the teacher to manually press space first.
    try {
      mf.executeCommand(['insert', '\\,\\frac{#@}{#?}']);
    } catch (err) {
      try { mf.insert('\\;\\frac{}{}'); } catch (ignored) {}
    }
    scheduleSave();
  }

  function command(name) {
    if (activeCell) {
      if (name === 'backspace') { backspaceCell(); return; }
      if (name === 'next' || name === 'out' || name === 'advance') { moveCell(1); return; }
      if (name === 'newline') { activeCell = null; clearActiveCell(); const mf = makeRow(''); setActive(mf); mf.focus({ preventScroll: true }); scheduleSave(); return; }
    }
    const mf = focusActive();
    try {
      if (name === 'backspace') mf.executeCommand('deleteBackward');
      if (name === 'next') mf.executeCommand('moveToNextPlaceholder');
      if (name === 'out') mf.executeCommand('moveAfterParent');
      if (name === 'advance') {
        // Try next placeholder; if none, exit current parent (e.g. fraction).
        if (!mf.executeCommand('moveToNextPlaceholder')) {
          mf.executeCommand('moveAfterParent');
        }
      }
      if (name === 'undo') mf.executeCommand('undo');
      if (name === 'redo') mf.executeCommand('redo');
      if (name === 'newline') newLineAfter(mf);
    } catch (err) {
      if (name === 'newline') newLineAfter(mf);
    }
    scheduleSave();
  }

  function newLineAfter(mf) {
    const row = mf.closest('.row');
    const newMf = makeRow('');
    const newRow = newMf.closest('.row');
    if (row.classList.contains('positioned')) {
      const x = parseFloat(row.style.left) || 0;
      const y = parseFloat(row.style.top) || 0;
      const h = row.offsetHeight || 60;
      positionRow(newRow, x, y + h + 6);
    } else {
      stage.insertBefore(newRow, row.nextSibling);
    }
    setActive(newMf);
    newMf.focus({ preventScroll: true });
    newMf.scrollIntoView({ block: 'nearest' });
    scheduleSave();
  }


  function clearActiveCell() {
    document.querySelectorAll('.digit-cell.active').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.algo-block.active').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.algo-holder.active').forEach(h => h.classList.remove('active'));
  }

  function setActiveCell(cell) {
    clearActiveCell();
    activeCell = cell;
    if (cell) {
      cell.classList.add('active');
      cell.closest('.algo-block')?.classList.add('active');
      cell.closest('.algo-holder')?.classList.add('active');
      document.querySelectorAll('.row').forEach(row => row.classList.remove('active'));
    }
  }

  function orderedCells(block) {
    const cells = [...block.querySelectorAll('.digit-cell')];
    return cells
      .map((cell, fallback) => ({ cell, order: Number(cell.dataset.entryOrder ?? fallback) }))
      .sort((a, b) => a.order - b.order)
      .map(item => item.cell);
  }

  function assignRightToLeftOrders(block, options = {}) {
    let order = 0;
    const rows = [...block.querySelectorAll('.algo-row, .work-row, .longdiv-quotient, .longdiv-main')];

    function assignRow(row, direction = 'rtl') {
      const cells = [...row.querySelectorAll('.digit-cell')];
      const ordered = direction === 'rtl' ? cells.reverse() : cells;
      ordered.forEach(cell => { cell.dataset.entryOrder = String(order++); });
    }

    if (options.type === 'div') {
      // Long division setup and solving naturally move left-to-right through the dividend/quotient work.
      rows.forEach(row => assignRow(row, 'ltr'));
      return;
    }

    // For vertical addition/subtraction/multiplication, operand entry begins in the ones place.
    // Carry/borrow, work, partial, and answer rows are place-specific marks: tap the column and enter there.
    const operandRows = rows.filter(row => row.classList.contains('operand'));
    const supportRows = rows.filter(row => row.classList.contains('carry'));
    const finishRows = rows.filter(row => row.classList.contains('partial') || row.classList.contains('answer') || row.classList.contains('work'));
    [...operandRows, ...supportRows, ...finishRows].forEach(row => assignRow(row, 'rtl'));
  }

  function cellsForRow(row) {
    return [...row.querySelectorAll('.digit-cell')];
  }

  function readRowDigits(row) {
    const saved = row.dataset.entryValue;
    if (saved !== undefined) return saved;
    return cellsForRow(row).map(c => c.textContent || '').join('').replace(/^\s+/, '');
  }

  function writeRowDigits(row, value) {
    let cells = cellsForRow(row);
    const digits = String(value || '').replace(/[^0-9]/g, '');
    if (digits.length > cells.length) {
      const block = row.closest('.algo-block');
      if (block) expandAlgoBlock(block, digits.length - cells.length);
      cells = cellsForRow(row);
    }
    const clean = digits.slice(-cells.length);
    row.dataset.entryValue = clean;
    cells.forEach(c => { c.textContent = ''; });
    let cellIndex = cells.length - 1;
    for (let i = clean.length - 1; i >= 0 && cellIndex >= 0; i--, cellIndex--) {
      cells[cellIndex].textContent = clean[i];
    }
    // Keep the active target at the ones place. New digits append to the right of the number,
    // while the displayed digits shift left like place-value boxes.
    setActiveCell(cells[cells.length - 1]);
  }

  function activeAlgorithmRow() {
    if (!activeCell) return null;
    const block = activeCell.closest('.algo-block');
    if (!block || block.classList.contains('longdiv-block')) return null;
    return activeCell.closest('.algo-row');
  }

  function isAutoNumberRow(row) {
    // Only the actual operands behave like typed numbers that build from the ones place.
    // Carries, borrows, partial products, work rows, and final answers are column-specific.
    return !!row && row.classList.contains('operand');
  }

  function insertIntoCell(text) {
    if (!activeCell) return false;
    const row = activeAlgorithmRow();
    if (isAutoNumberRow(row) && /^[0-9]$/.test(text)) {
      writeRowDigits(row, readRowDigits(row) + text);
      scheduleSave();
      return true;
    }
    // Carry/borrow, work/partial, and answer rows are place-specific: tap the exact place, then enter the digit.
    // Do not shift these like full-number operand rows.
    activeCell.textContent = text;
    if (!row || isAutoNumberRow(row)) moveCell(1);
    scheduleSave();
    return true;
  }

  function backspaceCell() {
    if (!activeCell) return false;
    const row = activeAlgorithmRow();
    if (isAutoNumberRow(row)) {
      const current = readRowDigits(row);
      if (current.length) {
        writeRowDigits(row, current.slice(0, -1));
      } else {
        moveCell(-1);
      }
      scheduleSave();
      return true;
    }
    const t = activeCell.textContent || '';
    if (t.length) activeCell.textContent = '';
    else if (!row) moveCell(-1);
    scheduleSave();
    return true;
  }

  function moveCell(delta) {
    if (!activeCell) return false;
    const cells = orderedCells(activeCell.closest('.algo-block'));
    const i = cells.indexOf(activeCell);
    const next = cells[Math.max(0, Math.min(cells.length - 1, i + delta))];
    setActiveCell(next);
    return true;
  }

  const DEFAULT_ALGO_COLUMNS = 5;
  const MAX_ALGO_COLUMNS = 14;

  function makeCells(n) {
    return Array.from({ length: n }, () => '<span class="digit-cell" tabindex="0"></span>').join('');
  }

  function wireDigitCell(cell) {
    cell.addEventListener('pointerdown', event => {
      event.preventDefault();
      setActiveCell(cell);
    });
  }

  function algorithmColumnCount(block) {
    const value = Number(block?.dataset.columns);
    return Number.isFinite(value) && value > 0 ? value : DEFAULT_ALGO_COLUMNS;
  }

  function addColumnToRow(row) {
    const cell = document.createElement('span');
    cell.className = 'digit-cell';
    cell.tabIndex = 0;
    const first = row.querySelector('.digit-cell');
    if (first) row.insertBefore(cell, first);
    else row.appendChild(cell);
    wireDigitCell(cell);
  }

  function expandAlgoBlock(block, amount = 1) {
    if (!block) return false;
    const current = algorithmColumnCount(block);
    const target = Math.min(MAX_ALGO_COLUMNS, current + Math.max(1, amount));
    if (target <= current) return false;

    for (let i = current; i < target; i += 1) {
      if (block.dataset.alg === 'div') {
        addColumnToRow(block.querySelector('.longdiv-quotient'));
        addColumnToRow(block.querySelector('.dividend-cells'));
        block.querySelectorAll('.work-row').forEach(addColumnToRow);
      } else {
        block.querySelectorAll('.algo-row').forEach(addColumnToRow);
      }
    }

    block.dataset.columns = String(target);
    block.style.setProperty('--algo-cols', String(target));
    assignRightToLeftOrders(block, { type: block.dataset.alg });
    updateStageMinHeight();
    return true;
  }

  function makeAlgoBlock(type, columns = DEFAULT_ALGO_COLUMNS) {
    const columnCount = Math.max(DEFAULT_ALGO_COLUMNS, Math.min(MAX_ALGO_COLUMNS, Number(columns) || DEFAULT_ALGO_COLUMNS));
    const block = document.createElement('div');
    block.className = 'algo-block ' + type + (type === 'div' ? ' longdiv-block' : '');
    block.dataset.alg = type;
    block.dataset.columns = String(columnCount);
    block.style.setProperty('--algo-cols', String(columnCount));
    if (type === 'add' || type === 'sub') {
      const op = type === 'add' ? '+' : '−';
      const carryClass = type === 'sub' ? 'algo-row carry borrow' : 'algo-row carry';
      block.innerHTML = `
        <div class="${carryClass}"><span class="opcell"></span>${makeCells(columnCount)}</div>
        <div class="algo-row operand"><span class="opcell"></span>${makeCells(columnCount)}</div>
        <div class="algo-row operand"><span class="opcell">${op}</span>${makeCells(columnCount)}</div>
        <div class="algo-row answer"><span class="opcell"></span>${makeCells(columnCount)}</div>`;
    } else if (type === 'mul') {
      block.innerHTML = `
        <div class="algo-row carry"><span class="opcell"></span>${makeCells(columnCount)}</div>
        <div class="algo-row operand"><span class="opcell"></span>${makeCells(columnCount)}</div>
        <div class="algo-row operand"><span class="opcell">×</span>${makeCells(columnCount)}</div>
        <div class="algo-row partial"><span class="opcell"></span>${makeCells(columnCount)}</div>
        <div class="algo-row partial"><span class="opcell"></span>${makeCells(columnCount)}</div>
        <div class="algo-row answer"><span class="opcell"></span>${makeCells(columnCount)}</div>`;
    } else if (type === 'div') {
      block.innerHTML = `
        <div class="longdiv-quotient"><span></span>${makeCells(columnCount)}</div>
        <div class="longdiv-main"><div class="divisor-cells">${makeCells(2)}</div><div class="dividend-cells">${makeCells(columnCount)}</div></div>
        <div class="work-row"><span></span>${makeCells(columnCount)}</div>
        <div class="work-row"><span></span>${makeCells(columnCount)}</div>
        <div class="work-row"><span></span>${makeCells(columnCount)}</div>
        <div class="work-row"><span></span>${makeCells(columnCount)}</div>`;
    }
    assignRightToLeftOrders(block, { type });
    block.querySelectorAll('.digit-cell').forEach(wireDigitCell);
    const holder = document.createElement('div');
    holder.className = 'algo-holder';

    const grip = document.createElement('div');
    grip.className = 'algo-grip';
    grip.setAttribute('aria-label', 'drag algorithm');
    holder.appendChild(grip);
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'algo-delete';
    del.setAttribute('aria-label', 'delete algorithm block');
    del.textContent = '×';
    del.addEventListener('pointerdown', event => { event.preventDefault(); event.stopPropagation(); });
    del.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      holder.remove();
      activeCell = null;
      clearActiveCell();
      scheduleSave();
    });
    holder.appendChild(del);

    const expand = document.createElement('button');
    expand.type = 'button';
    expand.className = 'algo-expand';
    expand.setAttribute('aria-label', 'add place-value column');
    expand.textContent = '+';
    expand.addEventListener('pointerdown', event => { event.preventDefault(); event.stopPropagation(); });
    expand.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      if (expandAlgoBlock(block)) scheduleSave();
    });
    holder.appendChild(expand);
    holder.appendChild(block);
    enableDrag(holder, grip);

    // Decide placement: positioned alongside current positioned context, or flow at insertion point.
    const currentRow = activeField?.closest('.row');
    const currentHolder = activeCell?.closest('.algo-holder');
    if (currentRow && currentRow.classList.contains('positioned')) {
      stage.appendChild(holder);
      const x = parseFloat(currentRow.style.left) || 0;
      const y = parseFloat(currentRow.style.top) || 0;
      const h = currentRow.offsetHeight || 60;
      positionAlgo(holder, x, y + h + 6);
    } else if (currentHolder && currentHolder.classList.contains('positioned')) {
      stage.appendChild(holder);
      const x = parseFloat(currentHolder.style.left) || 0;
      const y = parseFloat(currentHolder.style.top) || 0;
      const h = currentHolder.offsetHeight || 120;
      positionAlgo(holder, x + h * 0.6, y + 12);
    } else if (currentMode === 'worksheet') {
      // Worksheet mode with no positioned context: place at top-left of visible stage.
      stage.appendChild(holder);
      const scrollTop = pad.scrollTop || 0;
      positionAlgo(holder, 24, scrollTop + 24);
    } else if (currentRow && currentRow.nextSibling) {
      stage.insertBefore(holder, currentRow.nextSibling);
    } else {
      stage.appendChild(holder);
    }
    setActiveCell(orderedCells(block)[0] || block.querySelector('.digit-cell'));
    scheduleSave();
  }

  function saveNow() {
    const items = [...stage.children]
      .filter(el => el !== worksheetImg)
      .map(el => {
        const positioned = el.classList.contains('positioned');
        const x = positioned ? (parseFloat(el.dataset.x) || parseFloat(el.style.left) || 0) : null;
        const y = positioned ? (parseFloat(el.dataset.y) || parseFloat(el.style.top) || 0) : null;
        if (el.classList.contains('row')) {
          return {
            kind: 'row',
            latex: el.querySelector('math-field')?.value || '',
            positioned, x, y,
          };
        }
        if (el.classList.contains('algo-holder')) {
          const b = el.querySelector('.algo-block');
          return {
            kind: 'alg',
            type: b?.dataset.alg || 'add',
            columns: algorithmColumnCount(b),
            values: [...b.querySelectorAll('.digit-cell')].map(c => c.textContent || ''),
            positioned, x, y,
          };
        }
        return null;
      })
      .filter(Boolean);
    localStorage.setItem(storageKey, JSON.stringify({
      items,
      mode: currentMode,
      mathSize,
      worksheet: worksheetDataUrl,
      worksheetScale,
      backgroundScale,
      tools: toolStates,
    }));
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 120);
  }

  function applyMathSize() {
    mathSize = Math.max(24, Math.min(76, mathSize));
    document.documentElement.style.setProperty('--math-size', mathSize + 'px');
    localStorage.setItem('math-things-math-pad-size', String(mathSize));
  }

  function changeMathSize(delta) {
    mathSize += delta;
    applyMathSize();
    scheduleSave();
  }

  function applyWorksheetScale() {
    worksheetScale = Math.max(0.55, Math.min(3.0, worksheetScale));
    worksheetImg.style.width = (worksheetScale * 100) + '%';
    localStorage.setItem('math-things-worksheet-scale', String(worksheetScale));
    updateStageMinHeight();
  }

  function applyBackgroundScale() {
    backgroundScale = Math.max(0.5, Math.min(3.0, backgroundScale));
    pad.style.setProperty('--paper-line-size', (48 * backgroundScale) + 'px');
    pad.style.setProperty('--paper-grid-size', (24 * backgroundScale) + 'px');
    localStorage.setItem('math-things-background-scale', String(backgroundScale));
  }

  function scalePositionedAnnotations(ratio) {
    if (!Number.isFinite(ratio) || ratio <= 0 || Math.abs(ratio - 1) < 0.001) return;
    [...stage.children].forEach(el => {
      if (el === worksheetImg || !el.classList.contains('positioned')) return;
      const x = (parseFloat(el.dataset.x) || parseFloat(el.style.left) || 0) * ratio;
      const y = (parseFloat(el.dataset.y) || parseFloat(el.style.top) || 0) * ratio;
      if (el.classList.contains('row')) positionRow(el, x, y);
      if (el.classList.contains('algo-holder')) positionAlgo(el, x, y);
    });
  }

  function changeWorksheetScale(delta) {
    const old = worksheetScale;
    worksheetScale = Math.max(0.55, Math.min(3.0, worksheetScale + delta));
    const ratio = worksheetScale / old;
    if (currentMode === 'worksheet') scalePositionedAnnotations(ratio);
    applyWorksheetScale();
    scheduleSave();
  }

  function changeCurrentBackgroundScale(delta) {
    if (currentMode === 'worksheet') {
      changeWorksheetScale(delta);
      return;
    }
    backgroundScale = Math.max(0.5, Math.min(3.0, backgroundScale + delta));
    applyBackgroundScale();
    scheduleSave();
  }

  function setCurrentBackgroundScaleFromRatio(startScale, ratio) {
    if (!Number.isFinite(ratio) || ratio <= 0) return;
    if (currentMode === 'worksheet') {
      const old = worksheetScale;
      worksheetScale = Math.max(0.55, Math.min(3.0, startScale * ratio));
      const annotationRatio = worksheetScale / old;
      scalePositionedAnnotations(annotationRatio);
      applyWorksheetScale();
    } else {
      backgroundScale = Math.max(0.5, Math.min(3.0, startScale * ratio));
      applyBackgroundScale();
    }
    scheduleSave();
  }

  function load() {
    try {
      const raw = localStorage.getItem(storageKey);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (typeof data.mathSize === 'number') mathSize = data.mathSize;
      if (typeof data.worksheetScale === 'number') worksheetScale = data.worksheetScale;
      if (typeof data.backgroundScale === 'number') backgroundScale = data.backgroundScale;
      applyMathSize();
      applyWorksheetScale();
      applyBackgroundScale();

      // Clear stage but preserve the worksheet img element.
      [...stage.children].forEach(el => { if (el !== worksheetImg) el.remove(); });

      if (data.worksheet) {
        worksheetDataUrl = data.worksheet;
        worksheetImg.src = worksheetDataUrl;
        applyWorksheetScale();
      } else {
        worksheetDataUrl = null;
        worksheetImg.src = '';
        worksheetImg.classList.add('hidden');
      }

      let modeToSet = data.mode || 'plain';
      if (modeToSet === 'worksheet' && !worksheetDataUrl) modeToSet = 'plain';
      setMode(modeToSet);

      const items = Array.isArray(data.items) && data.items.length
        ? data.items
        : (Array.isArray(data.rows) ? data.rows.map(latex => ({ kind: 'row', latex })) : [{ kind: 'row', latex: '' }]);
      items.forEach(item => {
        if (item.kind === 'row') {
          const mf = makeRow(item.latex || '');
          if (item.positioned) positionRow(mf.closest('.row'), item.x || 0, item.y || 0);
        }
        if (item.kind === 'alg') {
          makeAlgoBlock(item.type || 'add', item.columns || DEFAULT_ALGO_COLUMNS);
          const holder = stage.lastElementChild;
          const block = holder?.querySelector('.algo-block');
          const cells = block ? [...block.querySelectorAll('.digit-cell')] : [];
          (item.values || []).forEach((v, i) => { if (cells[i]) cells[i].textContent = v; });
          if (holder && item.positioned) positionAlgo(holder, item.x || 0, item.y || 0);
        }
      });
      activeCell = null;
      clearActiveCell();
      setActive(document.querySelector('math-field') || makeRow(''));

      // Restore tool states; will be rendered after dock builds.
      if (data.tools && typeof data.tools === 'object') {
        Object.entries(data.tools).forEach(([id, s]) => {
          if (TOOLS.find(t => t.id === id)) {
            toolStates[id] = { ...s };
            if (typeof s.z === 'number' && s.z > toolZTop) toolZTop = s.z + 1;
          }
        });
      }
      return true;
    } catch (err) {
      return false;
    }
  }

  // ===== Teaching Table: positioning, dragging, worksheet =====

  function positionRow(row, x, y) {
    row.classList.add('positioned');
    row.style.left = Math.max(0, x) + 'px';
    row.style.top = Math.max(0, y) + 'px';
    row.dataset.x = String(Math.max(0, x));
    row.dataset.y = String(Math.max(0, y));
    updateStageMinHeight();
  }

  function positionAlgo(holder, x, y) {
    holder.classList.add('positioned');
    holder.style.left = Math.max(0, x) + 'px';
    holder.style.top = Math.max(0, y) + 'px';
    holder.dataset.x = String(Math.max(0, x));
    holder.dataset.y = String(Math.max(0, y));
    updateStageMinHeight();
  }

  function updateStageMinHeight() {
    let maxBottom = 0;
    [...stage.children].forEach(el => {
      if (el === worksheetImg) return;
      if (el.classList.contains('positioned')) {
        const top = parseFloat(el.style.top) || 0;
        const bottom = top + (el.offsetHeight || 0) + 60;
        if (bottom > maxBottom) maxBottom = bottom;
      }
    });
    stage.style.minHeight = maxBottom > 0 ? maxBottom + 'px' : '';
  }

  function enableDrag(target, handle) {
    let state = null;
    handle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      handle.setPointerCapture(e.pointerId);
      // If target is not yet positioned, capture current visual location and switch to positioned.
      if (!target.classList.contains('positioned')) {
        const tRect = target.getBoundingClientRect();
        const sRect = stage.getBoundingClientRect();
        if (target.classList.contains('row')) {
          positionRow(target, tRect.left - sRect.left, tRect.top - sRect.top);
        } else if (target.classList.contains('algo-holder')) {
          positionAlgo(target, tRect.left - sRect.left, tRect.top - sRect.top);
        }
      }
      const left = parseFloat(target.style.left) || 0;
      const top = parseFloat(target.style.top) || 0;
      state = { id: e.pointerId, startX: e.clientX, startY: e.clientY, startLeft: left, startTop: top };
      target.classList.add('active');
    });
    handle.addEventListener('pointermove', (e) => {
      if (!state || e.pointerId !== state.id) return;
      const dx = e.clientX - state.startX;
      const dy = e.clientY - state.startY;
      let x = Math.max(0, state.startLeft + dx);
      let y = Math.max(0, state.startTop + dy);
      if (window.TeachingTableSnap?.snap) {
        const snapped = window.TeachingTableSnap.snap(target, x, y);
        x = snapped.x;
        y = snapped.y;
      }
      target.style.left = x + 'px';
      target.style.top = y + 'px';
      updateStageMinHeight();
    });
    function commit(e) {
      if (!state || e.pointerId !== state.id) return;
      const x = parseFloat(target.style.left) || 0;
      const y = parseFloat(target.style.top) || 0;
      target.dataset.x = String(x);
      target.dataset.y = String(y);
      window.TeachingTableSnap?.clear?.();
      state = null;
      scheduleSave();
    }
    handle.addEventListener('pointerup', commit);
    handle.addEventListener('pointercancel', commit);
  }

  function setMode(mode) {
    if (!['plain', 'lined', 'grid', 'worksheet'].includes(mode)) mode = 'plain';
    currentMode = mode;
    pad.className = mode;
    ['plain', 'lined', 'grid', 'worksheet'].forEach(m => {
      const btn = document.getElementById(m + 'Btn');
      if (btn) btn.classList.toggle('is-on', m === mode);
    });
    if (mode === 'worksheet' && worksheetDataUrl) {
      worksheetImg.src = worksheetDataUrl;
      worksheetImg.classList.remove('hidden');
    } else {
      worksheetImg.classList.add('hidden');
    }
    scheduleSave();
  }

  function loadWorksheetImage(dataUrl) {
    worksheetDataUrl = dataUrl;
    worksheetImg.src = dataUrl;
    applyWorksheetScale();
    setMode('worksheet');
    // Scroll to top so the new worksheet is visible.
    pad.scrollTop = 0;
  }

  worksheetImg.addEventListener('load', () => { updateStageMinHeight(); });

  function chooseWorksheetFile() {
    worksheetFileInput.value = '';
    worksheetFileInput.click();
  }

  async function renderPdfWorksheet(file) {
    if (!window.pdfjsLib) throw new Error('PDF renderer failed to load.');

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const bytes = new Uint8Array(await file.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
    const page = await pdf.getPage(1);
    const baseViewport = page.getViewport({ scale: 1 });

    // Teaching Table currently has a single worksheet background surface.
    // Render page 1 crisply, then reuse the existing image-background path.
    const targetWidth = 1600;
    const renderScale = Math.max(1, Math.min(2.5, targetWidth / baseViewport.width));
    const viewport = page.getViewport({ scale: renderScale });

    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    await page.render({ canvasContext: ctx, viewport }).promise;
    return canvas.toDataURL('image/jpeg', 0.94);
  }

  async function handleWorksheetFile(file) {
    if (!file) return false;

    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
    if (isPdf) {
      try {
        const dataUrl = await renderPdfWorksheet(file);
        loadWorksheetImage(dataUrl);
        return true;
      } catch (err) {
        console.error('Could not load PDF worksheet:', err);
        alert('Teaching Table could not open that PDF.');
        return false;
      }
    }

    if (!file.type || !file.type.startsWith('image/')) return false;
    const reader = new FileReader();
    reader.onload = (ev) => loadWorksheetImage(ev.target.result);
    reader.readAsDataURL(file);
    return true;
  }

  // Stage click → create positioned row in worksheet mode.
  stage.addEventListener('click', (e) => {
    if (Date.now() < suppressStageClickUntil) return;
    if (currentMode !== 'worksheet') return;
    if (e.target !== stage && e.target !== worksheetImg) return;
    const rect = stage.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const mf = makeRow('');
    positionRow(mf.closest('.row'), x, y);
    setActive(mf);
    mf.focus({ preventScroll: true });
    scheduleSave();
  });

  // File input change.
  worksheetFileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    handleWorksheetFile(file);
  });

  // Drag-and-drop worksheet image or PDF anywhere on window.
  let dragCounter = 0;
  window.addEventListener('dragenter', (e) => {
    if (!e.dataTransfer || !e.dataTransfer.types) return;
    if ([...e.dataTransfer.types].includes('Files')) {
      e.preventDefault();
      dragCounter++;
      dropOverlay.classList.add('show');
    }
  });
  window.addEventListener('dragover', (e) => {
    if (!e.dataTransfer || !e.dataTransfer.types) return;
    if ([...e.dataTransfer.types].includes('Files')) e.preventDefault();
  });
  window.addEventListener('dragleave', () => {
    dragCounter = Math.max(0, dragCounter - 1);
    if (dragCounter === 0) dropOverlay.classList.remove('show');
  });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('show');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    handleWorksheetFile(file);
  });

  // Paste image from clipboard.
  window.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type && item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (handleWorksheetFile(file)) { e.preventDefault(); return; }
      }
    }
  });

  // ===== Worksheet source modal: QR phone scan + file picker =====

  function makeSessionId() {
    // 8-char base36 uppercase. ~2.8 trillion possibilities. Plenty for short-lived sessions.
    const part = () => Math.random().toString(36).substring(2, 6).toUpperCase();
    return part() + part();
  }

  function renderQrCode(url) {
    // Replace placeholder with a canvas, then draw QR.
    qrFrame.classList.remove('placeholder');
    qrFrame.innerHTML = '';
    const canvas = document.createElement('canvas');
    qrFrame.appendChild(canvas);
    if (typeof QRCode === 'undefined') {
      qrFrame.classList.add('placeholder');
      qrFrame.textContent = 'QR library failed to load. Check internet connection.';
      return;
    }
    QRCode.toCanvas(canvas, url, {
      width: 248,
      margin: 1,
      color: { dark: '#1d1d1f', light: '#fffdf6' },
      errorCorrectionLevel: 'M',
    }, (err) => {
      if (err) {
        qrFrame.classList.add('placeholder');
        qrFrame.textContent = 'Could not render QR code: ' + err.message;
      }
    });
  }

  function showQrPlaceholder(message) {
    qrFrame.innerHTML = '';
    qrFrame.classList.add('placeholder');
    qrFrame.textContent = message;
  }

  async function pollOnce(sessionId) {
    if (!WORKER_URL || sessionId !== activeSessionId) return;
    try {
      const res = await fetch(`${WORKER_URL}/image/${sessionId}`, { method: 'GET' });
      if (res.status === 200) {
        const dataUrl = (await res.text()).trim();
        if (dataUrl.startsWith('data:image/')) {
          modalStatus.textContent = '✓ Received from phone';
          modalStatus.classList.add('success');
          stopPolling();
          loadWorksheetImage(dataUrl);
          setTimeout(closeWorksheetModal, 600);
        }
      }
      // 204 = nothing yet; just keep polling
    } catch (e) {
      // Network blip — keep polling silently
    }
  }

  function startPolling(sessionId) {
    stopPolling();
    if (!WORKER_URL) return;
    pollTimer = setInterval(() => pollOnce(sessionId), 1500);
    // Run one immediately so the first cycle is fast
    pollOnce(sessionId);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function openWorksheetModal() {
    modalStatus.classList.remove('success', 'error');
    modalStatus.textContent = 'Waiting for phone…';
    if (WORKER_URL) {
      const sessionId = makeSessionId();
      activeSessionId = sessionId;
      const phoneUrl = `${WORKER_URL}/u/${sessionId}`;
      renderQrCode(phoneUrl);
      modalUrl.textContent = phoneUrl;
      startPolling(sessionId);
    } else {
      activeSessionId = null;
      showQrPlaceholder('Phone scan not configured yet.\nSee deployment notes to enable.');
      modalUrl.textContent = '';
      modalStatus.textContent = 'Pick a file below to load a worksheet.';
    }
    worksheetModal.classList.add('show');
  }

  function closeWorksheetModal() {
    stopPolling();
    activeSessionId = null;
    worksheetModal.classList.remove('show');
  }

  modalPickBtn.addEventListener('click', () => {
    closeWorksheetModal();
    chooseWorksheetFile();
  });
  modalCancelBtn.addEventListener('click', closeWorksheetModal);

  // Click outside the card to close.
  worksheetModal.addEventListener('click', (e) => {
    if (e.target === worksheetModal) closeWorksheetModal();
  });

  // Escape key to close.
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && worksheetModal.classList.contains('show')) {
      closeWorksheetModal();
    }
  });

  // ===== end Worksheet source modal =====

  // ===== Tools dock and floating tool windows =====

  const toolStates = {}; // { id: { x, y, w, h, open, z } }
  let toolZTop = 100;

  function defaultToolPosition(tool) {
    const openCount = Object.values(toolStates).filter(s => s.open).length;
    const offset = openCount * 32;
    return { x: 28 + offset, y: 28 + offset, w: tool.w, h: tool.h };
  }

  function getLayerBounds() {
    const layer = document.getElementById('tools-layer');
    if (!layer) return { width: 800, height: 600 };
    return { width: layer.offsetWidth, height: layer.offsetHeight };
  }

  // Tools should never disappear into a taskbar/icon state. They have a
  // minimum bench footprint, measured from the current workspace, and when a
  // tool is shoved into a corner we shrink/smoosh it down to that footprint
  // rather than letting most of it live off-screen.
  const TITLEBAR_HEIGHT = 32;

  function getToolConfig(idOrWin) {
    const id = typeof idOrWin === 'string' ? idOrWin : idOrWin?.dataset?.toolId;
    return TOOLS.find(t => t.id === id) || null;
  }

  function getMinToolSize(tool) {
    const b = getLayerBounds();
    const minW = Math.max(tool?.minW || 240, Math.floor(b.width * (tool?.minWFrac ?? 0.18)));
    const minH = Math.max(tool?.minH || 170, Math.floor(b.height * (tool?.minHFrac ?? 0.18)));
    return {
      w: Math.min(minW, Math.max(160, b.width - 8)),
      h: Math.min(minH, Math.max(110, b.height - 8)),
    };
  }

  function fitToolRect(tool, width, height, x, y) {
    const b = getLayerBounds();
    const min = getMinToolSize(tool);
    const maxW = Math.max(min.w, b.width);
    const maxH = Math.max(min.h, b.height);
    const w = Math.min(maxW, Math.max(min.w, Number(width) || min.w));
    const h = Math.min(maxH, Math.max(min.h, Number(height) || min.h));
    const nx = Math.max(0, Math.min(Math.max(0, b.width - w), Number(x) || 0));
    const ny = Math.max(0, Math.min(Math.max(0, b.height - h), Number(y) || 0));
    return { x: nx, y: ny, w, h };
  }

  function clampWindowPosition(width, height, x, y, toolId) {
    const tool = getToolConfig(toolId);
    const fit = fitToolRect(tool, width, height, x, y);
    return { x: fit.x, y: fit.y };
  }

  function applyToolRect(win, rect) {
    win.style.left = rect.x + 'px';
    win.style.top = rect.y + 'px';
    win.style.width = rect.w + 'px';
    win.style.height = rect.h + 'px';
    updateToolScale(win);
    const s = toolStates[win.dataset.toolId];
    if (s) { s.x = rect.x; s.y = rect.y; s.w = rect.w; s.h = rect.h; }
  }

  function updateToolScale(win) {
    const tool = getToolConfig(win);
    const viewport = win.querySelector('.tool-viewport');
    const iframe = win.querySelector('.tool-frame');
    if (!viewport || !iframe || !tool) return;
    const vw = Math.max(1, viewport.clientWidth);
    const vh = Math.max(1, viewport.clientHeight);
    const baseW = tool.baseW || tool.w || 800;
    const baseH = tool.baseH || tool.h || 600;

    // If the body is smaller than the tool's natural canvas, scale down.
    // If the body is larger, let the iframe grow to the actual body size so
    // responsive tools (especially Number Line) can notice the expansion.
    const scale = Math.min(vw / baseW, vh / baseH, 1);
    const frameW = Math.max(baseW, Math.ceil(vw / scale));
    const frameH = Math.max(baseH, Math.ceil(vh / scale));
    iframe.style.width = frameW + 'px';
    iframe.style.height = frameH + 'px';
    iframe.style.transform = `scale(${scale})`;
    iframe.style.transformOrigin = '0 0';
    win.classList.toggle('is-short', win.offsetHeight < 190);

    // Same-origin tools should get a resize event after the iframe dimensions
    // change. Cross-origin frames will simply ignore this attempt.
    clearTimeout(win.__resizePingTimer);
    win.__resizePingTimer = setTimeout(() => {
      try { iframe.contentWindow && iframe.contentWindow.dispatchEvent(new Event('resize')); } catch (ignored) {}
    }, 40);
  }

  function getWinRect(win) {
    return {
      left: parseFloat(win.style.left) || 0,
      top: parseFloat(win.style.top) || 0,
      width: parseFloat(win.style.width) || win.offsetWidth,
      height: parseFloat(win.style.height) || win.offsetHeight,
    };
  }

  function getRectOverlap(a, b) {
    const dx = Math.min(a.left + a.width, b.left + b.width) - Math.max(a.left, b.left);
    const dy = Math.min(a.top + a.height, b.top + b.height) - Math.max(a.top, b.top);
    if (dx <= 0 || dy <= 0) return null;
    return { dx, dy };
  }

  // Collision settling is deliberately post-gesture. While a window is being
  // dragged/resized it follows the hand exactly; on release, neighbors slide to
  // the nearest available side without changing size.
  const TOOL_GAP = 8;

  function rectFromFit(fit) {
    return { left: fit.x, top: fit.y, width: fit.w, height: fit.h };
  }

  function overlapArea(a, b) {
    const o = getRectOverlap(a, b);
    return o ? o.dx * o.dy : 0;
  }

  function chooseCollisionPlacement(anchor, other, allWindows, movedWin) {
    const oth = getWinRect(other);
    const tool = getToolConfig(other);
    const candidates = [
      { x: anchor.left + anchor.width + TOOL_GAP, y: oth.top },
      { x: anchor.left - oth.width - TOOL_GAP, y: oth.top },
      { x: oth.left, y: anchor.top + anchor.height + TOOL_GAP },
      { x: oth.left, y: anchor.top - oth.height - TOOL_GAP },
    ];

    let best = null;
    let bestScore = Infinity;

    for (const candidate of candidates) {
      const fit = fitToolRect(tool, oth.width, oth.height, candidate.x, candidate.y);
      const rect = rectFromFit(fit);
      if (getRectOverlap(anchor, rect)) continue;

      const travel = Math.hypot(rect.left - oth.left, rect.top - oth.top);
      let collisionPenalty = 0;

      for (const win of allWindows) {
        if (win === other) continue;
        const area = overlapArea(rect, getWinRect(win));
        if (!area) continue;
        collisionPenalty += area * (win === movedWin ? 100000 : 20);
      }

      const score = travel + collisionPenalty;
      if (score < bestScore) {
        best = fit;
        bestScore = score;
      }
    }

    return best;
  }

  function applyPushCollisions(movedWin) {
    const allWindows = [...document.querySelectorAll('.tool-window')];
    if (allWindows.length < 2) return;

    const queue = [movedWin];
    const moveCounts = new Map();
    let safety = 0;

    while (queue.length && safety++ < 80) {
      const anchorWin = queue.shift();
      const anchor = getWinRect(anchorWin);

      for (const other of allWindows) {
        if (other === anchorWin || other === movedWin) continue;
        if (!getRectOverlap(anchor, getWinRect(other))) continue;

        const next = chooseCollisionPlacement(anchor, other, allWindows, movedWin);
        if (!next) continue;

        const before = getWinRect(other);
        if (Math.abs(next.x - before.left) < 0.5 && Math.abs(next.y - before.top) < 0.5) continue;

        applyToolRect(other, next);
        const count = (moveCounts.get(other) || 0) + 1;
        moveCounts.set(other, count);
        if (count < 5) queue.push(other);
      }
    }
  }

  let DOMAIN_META = {
    OA:  { label: 'OA',  color: '#2e5894', fullName: 'Operations & Algebraic Thinking' },
    NBT: { label: 'NBT', color: '#e6954a', fullName: 'Number & Operations in Base Ten' },
    NF:  { label: 'NF',  color: '#c04a8a', fullName: 'Number & Operations — Fractions' },
    MD:  { label: 'MD',  color: '#2d8a4e', fullName: 'Measurement & Data' },
    G:   { label: 'G',   color: '#7c4ab8', fullName: 'Geometry' },
  };

  function buildDomainDock() {
    const dock = document.getElementById('tools-dock');
    if (!dock) return;
    dock.querySelectorAll('.domain-btn-wrap').forEach(el => el.remove());
    let tidyBtn = document.getElementById('tidyBtn');
    if (!tidyBtn) {
      tidyBtn = document.createElement('button');
      tidyBtn.className = 'tool-tidy';
      tidyBtn.id = 'tidyBtn';
      tidyBtn.setAttribute('aria-label', 'tidy windows');
      tidyBtn.textContent = '⌖ Tidy';
      dock.appendChild(tidyBtn);
    }

    Object.entries(DOMAIN_META).forEach(([domain, meta]) => {
      const wrap = document.createElement('div');
      wrap.className = 'domain-btn-wrap';
      wrap.dataset.domain = domain;
      wrap.innerHTML = `
        <button class="domain-btn" data-domain="${domain}" aria-haspopup="true" aria-expanded="false">
          <span class="domain-dot" style="background:${meta.color};"></span>
          ${meta.label}
          <span class="domain-chevron">▾</span>
        </button>
        <div class="domain-panel" data-domain="${domain}" role="menu"></div>
      `;
      dock.insertBefore(wrap, tidyBtn);
    });
  }

  function renderDock() {
    buildDomainDock();
    // Populate each domain panel with its tools
    Object.keys(DOMAIN_META).forEach(domain => {
      const panel = document.querySelector(`.domain-panel[data-domain="${domain}"]`);
      if (!panel) return;
      const tools = TOOLS.filter(t => t.domain === domain);
      panel.innerHTML = `
        <div class="domain-panel-header">${DOMAIN_META[domain].fullName}</div>
        <div class="domain-panel-grid">
          ${tools.map(tool => `
            <button class="domain-tool-btn" data-tool-id="${tool.id}" role="menuitem" aria-label="${tool.name}">
              <span class="domain-tool-icon">${tool.icon}</span>
              <span class="domain-tool-name">${tool.name}</span>
            </button>
          `).join('')}
        </div>`;
      panel.querySelectorAll('.domain-tool-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleTool(btn.dataset.toolId);
          closeDomainPanel(domain);
        });
      });
    });

    // Domain button toggle behavior
    document.querySelectorAll('.domain-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const domain = btn.dataset.domain;
        const isOpen = btn.getAttribute('aria-expanded') === 'true';
        closeAllDomainPanels();
        if (!isOpen) openDomainPanel(domain);
      });
    });

    // Tidy button
    const tidyBtn = document.getElementById('tidyBtn');
    if (tidyBtn) tidyBtn.addEventListener('click', tidyTools);

    // Close panels when clicking outside
    document.addEventListener('click', closeAllDomainPanels);

    updateDockButtonStates();
  }

  function openDomainPanel(domain) {
    const btn = document.querySelector(`.domain-btn[data-domain="${domain}"]`);
    const panel = document.querySelector(`.domain-panel[data-domain="${domain}"]`);
    if (!btn || !panel) return;
    btn.setAttribute('aria-expanded', 'true');
    btn.classList.add('open');
    panel.classList.add('open');
  }

  function closeDomainPanel(domain) {
    const btn = document.querySelector(`.domain-btn[data-domain="${domain}"]`);
    const panel = document.querySelector(`.domain-panel[data-domain="${domain}"]`);
    if (btn) { btn.setAttribute('aria-expanded', 'false'); btn.classList.remove('open'); }
    if (panel) panel.classList.remove('open');
  }

  function closeAllDomainPanels() {
    document.querySelectorAll('.domain-btn').forEach(b => {
      b.setAttribute('aria-expanded', 'false');
      b.classList.remove('open');
    });
    document.querySelectorAll('.domain-panel').forEach(p => p.classList.remove('open'));
  }

  function tidyTools() {
    const bounds = getLayerBounds();
    const maxW = Math.max(280, Math.floor(bounds.width * 0.62));
    const maxH = Math.max(220, Math.floor(bounds.height * 0.78));
    let x = 24, y = 24;
    const stepX = 36, stepY = 30;
    let row = 0;

    TOOLS.forEach((tool) => {
      const s = toolStates[tool.id];
      if (!s || !s.open) return;
      const w = Math.min(tool.w, maxW);
      const h = Math.min(tool.h, maxH);
      const win = document.querySelector(`.tool-window[data-tool-id="${tool.id}"]`);
      if (!win) return;
      // Wrap to next column if running off the bottom
      if (y + h > bounds.height - 20) {
        row++;
        y = 24;
        x = 24 + row * (stepX * 3);
      }
      const fitted = fitToolRect(tool, w, h, x, y);
      applyToolRect(win, fitted);
      s.z = ++toolZTop;
      win.style.zIndex = s.z;
      x += stepX;
      y += stepY;
    });
    scheduleSave();
  }

  function updateDockButtonStates() {
    // Update individual tool buttons inside panels
    document.querySelectorAll('.domain-tool-btn').forEach(btn => {
      const id = btn.dataset.toolId;
      btn.classList.toggle('active', !!toolStates[id]?.open);
    });
    // Show a filled dot on domain button if any tool in that domain is open
    Object.keys(DOMAIN_META).forEach(domain => {
      const anyOpen = TOOLS.filter(t => t.domain === domain).some(t => toolStates[t.id]?.open);
      const btn = document.querySelector(`.domain-btn[data-domain="${domain}"]`);
      if (btn) btn.classList.toggle('has-open', anyOpen);
    });
  }

  function toggleTool(id) {
    if (toolStates[id]?.open) {
      closeTool(id);
    } else {
      openTool(id);
    }
  }

  function openTool(id) {
    const tool = TOOLS.find(t => t.id === id);
    if (!tool) return;
    if (!toolStates[id]) {
      toolStates[id] = { ...defaultToolPosition(tool), open: true, z: ++toolZTop };
    } else {
      toolStates[id].open = true;
      toolStates[id].z = ++toolZTop;
    }
    buildToolWindow(tool);
    updateDockButtonStates();
    scheduleSave();
  }

  function closeTool(id) {
    if (!toolStates[id]) return;
    toolStates[id].open = false;
    const el = document.querySelector(`.tool-window[data-tool-id="${id}"]`);
    if (el) el.remove();
    updateDockButtonStates();
    scheduleSave();
  }

  function buildToolWindow(tool) {
    const state = toolStates[tool.id];
    const layer = document.getElementById('tools-layer');
    if (!layer) return null;

    // Clamp position into current viewport in case it was saved on a larger screen.
    const fittedState = fitToolRect(tool, state.w, state.h, state.x, state.y);
    state.x = fittedState.x;
    state.y = fittedState.y;
    state.w = fittedState.w;
    state.h = fittedState.h;

    let win = document.querySelector(`.tool-window[data-tool-id="${tool.id}"]`);
    if (win) {
      win.style.left = state.x + 'px';
      win.style.top = state.y + 'px';
      win.style.width = state.w + 'px';
      win.style.height = state.h + 'px';
      win.style.zIndex = state.z;
      updateToolScale(win);
      return win;
    }

    win = document.createElement('div');
    win.className = 'tool-window';
    win.dataset.toolId = tool.id;
    win.style.left = state.x + 'px';
    win.style.top = state.y + 'px';
    win.style.width = state.w + 'px';
    win.style.height = state.h + 'px';
    win.style.zIndex = state.z;

    const titlebar = document.createElement('div');
    titlebar.className = 'tool-titlebar';
    const grip = document.createElement('div');
    grip.className = 'tool-grip';
    const title = document.createElement('div');
    title.className = 'tool-title';
    title.textContent = tool.name;
    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'tool-close';
    closeBtn.setAttribute('aria-label', `close ${tool.name}`);
    closeBtn.textContent = '×';
    titlebar.appendChild(grip);
    titlebar.appendChild(title);
    titlebar.appendChild(closeBtn);

    const viewport = document.createElement('div');
    viewport.className = 'tool-viewport';

    const iframe = document.createElement('iframe');
    iframe.className = 'tool-frame';
    iframe.src = tool.url;
    iframe.title = tool.name;
    iframe.setAttribute('loading', 'lazy');
    viewport.appendChild(iframe);
    iframe.addEventListener('load', () => updateToolScale(win));
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => updateToolScale(win));
      ro.observe(viewport);
      win.__toolResizeObserver = ro;
    }

    const resize = document.createElement('div');
    resize.className = 'tool-resize';
    resize.setAttribute('aria-label', 'resize');

    const edgeGrips = ['n', 'e', 's', 'w'].map(edge => {
      const gripEl = document.createElement('div');
      gripEl.className = 'tool-move-edge ' + edge;
      gripEl.setAttribute('aria-label', 'move tool');
      return gripEl;
    });

    win.appendChild(titlebar);
    win.appendChild(viewport);
    edgeGrips.forEach(g => win.appendChild(g));
    win.appendChild(resize);
    layer.appendChild(win);
    updateToolScale(win);

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeTool(tool.id);
    });

    // Bring window to front on any interaction.
    win.addEventListener('pointerdown', () => {
      if (toolStates[tool.id]) {
        toolStates[tool.id].z = ++toolZTop;
        win.style.zIndex = toolStates[tool.id].z;
      }
    }, true);

    enableToolDrag(win, titlebar, iframe, tool.id);
    edgeGrips.forEach(g => enableToolDrag(win, g, iframe, tool.id));
    enableToolResize(win, resize, iframe, tool.id);
    enableToolPinch(win, iframe, tool.id);

    return win;
  }

  function enableToolDrag(win, handle, iframe, toolId) {
    let st = null;
    handle.addEventListener('pointerdown', (e) => {
      if (e.target.classList.contains('tool-close')) return;
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      iframe.style.pointerEvents = 'none';
      // Also disable pointer events on OTHER tool iframes so drag-overs don't
      // get swallowed by them. Restored on drag end.
      document.querySelectorAll('.tool-frame').forEach(f => {
        if (f !== iframe) f.dataset._priorPe = f.style.pointerEvents || '';
        if (f !== iframe) f.style.pointerEvents = 'none';
      });
      win.classList.add('dragging');
      const left = parseFloat(win.style.left) || 0;
      const top = parseFloat(win.style.top) || 0;
      st = { id: e.pointerId, startX: e.clientX, startY: e.clientY, startLeft: left, startTop: top };
    });
    handle.addEventListener('pointermove', (e) => {
      if (!st || e.pointerId !== st.id || win.__pinching) return;
      const proposedX = st.startLeft + e.clientX - st.startX;
      const proposedY = st.startTop + e.clientY - st.startY;
      const w = win.offsetWidth;
      const h = win.offsetHeight;
      const fitted = fitToolRect(getToolConfig(toolId), w, h, proposedX, proposedY);
      applyToolRect(win, fitted);
    });
    function end(e) {
      if (!st || e.pointerId !== st.id) return;
      iframe.style.pointerEvents = '';
      document.querySelectorAll('.tool-frame').forEach(f => {
        if (f !== iframe) {
          f.style.pointerEvents = f.dataset._priorPe || '';
          delete f.dataset._priorPe;
        }
      });
      win.classList.remove('dragging');
      if (toolStates[toolId]) {
        toolStates[toolId].x = parseFloat(win.style.left) || 0;
        toolStates[toolId].y = parseFloat(win.style.top) || 0;
        toolStates[toolId].w = parseFloat(win.style.width) || win.offsetWidth;
        toolStates[toolId].h = parseFloat(win.style.height) || win.offsetHeight;
      }
      applyPushCollisions(win);
      st = null;
      scheduleSave();
    }
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }

  function enableToolResize(win, handle, iframe, toolId) {
    let st = null;
    handle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      handle.setPointerCapture(e.pointerId);
      iframe.style.pointerEvents = 'none';
      const w = parseFloat(win.style.width) || win.offsetWidth;
      const h = parseFloat(win.style.height) || win.offsetHeight;
      st = { id: e.pointerId, startX: e.clientX, startY: e.clientY, startW: w, startH: h };
    });
    handle.addEventListener('pointermove', (e) => {
      if (!st || e.pointerId !== st.id || win.__pinching) return;
      const left = parseFloat(win.style.left) || 0;
      const top = parseFloat(win.style.top) || 0;
      const proposedW = st.startW + e.clientX - st.startX;
      const proposedH = st.startH + e.clientY - st.startY;
      const fitted = fitToolRect(getToolConfig(toolId), proposedW, proposedH, left, top);
      applyToolRect(win, fitted);
    });
    function end(e) {
      if (!st || e.pointerId !== st.id) return;
      iframe.style.pointerEvents = '';
      if (toolStates[toolId]) {
        toolStates[toolId].x = parseFloat(win.style.left) || 0;
        toolStates[toolId].y = parseFloat(win.style.top) || 0;
        toolStates[toolId].w = parseFloat(win.style.width) || 400;
        toolStates[toolId].h = parseFloat(win.style.height) || 400;
      }
      applyPushCollisions(win);
      st = null;
      scheduleSave();
    }
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }


  function resizeToolAroundCenter(win, toolId, scale, centerX = null, centerY = null) {
    const r = getWinRect(win);
    const cx = centerX == null ? r.left + r.width / 2 : centerX;
    const cy = centerY == null ? r.top + r.height / 2 : centerY;
    const newW = r.width * scale;
    const newH = r.height * scale;
    const nx = cx - (cx - r.left) * (newW / r.width);
    const ny = cy - (cy - r.top) * (newH / r.height);
    const fitted = fitToolRect(getToolConfig(toolId), newW, newH, nx, ny);
    applyToolRect(win, fitted);
  }

  function enableToolPinch(win, iframe, toolId) {
    const touches = new Map();
    let pinch = null;

    function disableIframes() {
      iframe.style.pointerEvents = 'none';
      document.querySelectorAll('.tool-frame').forEach(f => {
        if (f !== iframe) f.dataset._priorPe = f.style.pointerEvents || '';
        if (f !== iframe) f.style.pointerEvents = 'none';
      });
    }
    function restoreIframes() {
      iframe.style.pointerEvents = '';
      document.querySelectorAll('.tool-frame').forEach(f => {
        if (f !== iframe) {
          f.style.pointerEvents = f.dataset._priorPe || '';
          delete f.dataset._priorPe;
        }
      });
    }
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
    function layerPoint(clientX, clientY) {
      const rect = document.getElementById('tools-layer').getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }
    function beginIfReady() {
      if (touches.size < 2 || pinch) return;
      const [a, b] = [...touches.values()].slice(0, 2);
      const startDist = Math.max(20, dist(a, b));
      const startMid = mid(a, b);
      pinch = { startDist, startMid, startRect: getWinRect(win) };
      win.__pinching = true;
      win.classList.add('pinching');
      disableIframes();
    }
    function updatePinch() {
      if (!pinch || touches.size < 2) return;
      const [a, b] = [...touches.values()].slice(0, 2);
      const scale = Math.max(0.45, Math.min(2.25, dist(a, b) / pinch.startDist));
      const nowMid = mid(a, b);
      const sr = pinch.startRect;
      const centerX = nowMid.x;
      const centerY = nowMid.y;
      const newW = sr.width * scale;
      const newH = sr.height * scale;
      const nx = centerX - (pinch.startMid.x - sr.left) * scale;
      const ny = centerY - (pinch.startMid.y - sr.top) * scale;
      const fitted = fitToolRect(getToolConfig(toolId), newW, newH, nx, ny);
      applyToolRect(win, fitted);
    }
    function endIfNeeded() {
      if (touches.size >= 2) return;
      if (pinch) {
        pinch = null;
        win.__pinching = false;
        win.classList.remove('pinching');
        restoreIframes();
        if (toolStates[toolId]) {
          toolStates[toolId].x = parseFloat(win.style.left) || 0;
          toolStates[toolId].y = parseFloat(win.style.top) || 0;
          toolStates[toolId].w = parseFloat(win.style.width) || win.offsetWidth;
          toolStates[toolId].h = parseFloat(win.style.height) || win.offsetHeight;
        }
        applyPushCollisions(win);
        scheduleSave();
      }
    }

    win.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'touch') return;
      const p = layerPoint(e.clientX, e.clientY);
      touches.set(e.pointerId, p);
      try { win.setPointerCapture(e.pointerId); } catch (ignored) {}
      beginIfReady();
    }, true);
    win.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'touch' || !touches.has(e.pointerId)) return;
      const p = layerPoint(e.clientX, e.clientY);
      touches.set(e.pointerId, p);
      if (pinch) { e.preventDefault(); updatePinch(); }
    }, true);
    function pointerEnd(e) {
      if (touches.has(e.pointerId)) touches.delete(e.pointerId);
      endIfNeeded();
    }
    win.addEventListener('pointerup', pointerEnd, true);
    win.addEventListener('pointercancel', pointerEnd, true);

    // Desktop fallback: Ctrl/Alt + wheel over a tool embiggens/smallifies it.
    win.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.altKey) return;
      e.preventDefault();
      const layerRect = document.getElementById('tools-layer').getBoundingClientRect();
      const centerX = e.clientX - layerRect.left;
      const centerY = e.clientY - layerRect.top;
      const scale = e.deltaY < 0 ? 1.08 : 0.92;
      resizeToolAroundCenter(win, toolId, scale, centerX, centerY);
      clearTimeout(win.__collisionTimer);
      win.__collisionTimer = setTimeout(() => {
        applyPushCollisions(win);
        scheduleSave();
      }, 140);
    }, { passive: false });
  }


  function restoreOpenTools() {
    // Reopen any tools whose state.open is true (drawn from localStorage).
    TOOLS.forEach(tool => {
      const s = toolStates[tool.id];
      if (s && s.open) {
        buildToolWindow(tool);
      }
    });
    updateDockButtonStates();
  }

  function refitOpenTools() {
    document.querySelectorAll('.tool-window').forEach(win => {
      const tool = getToolConfig(win);
      const r = getWinRect(win);
      const fitted = fitToolRect(tool, r.width, r.height, r.left, r.top);
      applyToolRect(win, fitted);
    });
    scheduleSave();
  }

  window.addEventListener('resize', () => {
    clearTimeout(window.__toolResizeTimer);
    window.__toolResizeTimer = setTimeout(refitOpenTools, 120);
  });

  pad.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey || e.altKey)) return;
    e.preventDefault();
    changeCurrentBackgroundScale(e.deltaY > 0 ? -0.08 : 0.08);
  }, { passive: false });

  // Two-finger pinch on the paper itself zooms whichever background is active:
  // worksheet image, lined paper, or grid paper. Tool windows have their own
  // pinch handling and do not bubble through this surface.
  const backgroundTouches = new Map();
  let backgroundPinch = null;

  function backgroundPoint(e) {
    return { x: e.clientX, y: e.clientY };
  }

  function backgroundDistance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  pad.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    const bareBackground = e.target === pad || e.target === stage || e.target === worksheetImg;
    if (!bareBackground) return;
    backgroundTouches.set(e.pointerId, backgroundPoint(e));
    try { pad.setPointerCapture(e.pointerId); } catch (ignored) {}
    if (backgroundTouches.size === 2 && !backgroundPinch) {
      const [a, b] = [...backgroundTouches.values()];
      backgroundPinch = {
        distance: Math.max(20, backgroundDistance(a, b)),
        scale: currentMode === 'worksheet' ? worksheetScale : backgroundScale,
      };
    }
  });

  pad.addEventListener('pointermove', (e) => {
    if (!backgroundTouches.has(e.pointerId)) return;
    backgroundTouches.set(e.pointerId, backgroundPoint(e));
    if (!backgroundPinch || backgroundTouches.size < 2) return;
    e.preventDefault();
    const [a, b] = [...backgroundTouches.values()].slice(0, 2);
    const ratio = backgroundDistance(a, b) / backgroundPinch.distance;
    setCurrentBackgroundScaleFromRatio(backgroundPinch.scale, ratio);
  });

  function endBackgroundPointer(e) {
    backgroundTouches.delete(e.pointerId);
    if (backgroundPinch && backgroundTouches.size < 2) {
      backgroundPinch = null;
      suppressStageClickUntil = Date.now() + 300;
      scheduleSave();
    }
  }

  pad.addEventListener('pointerup', endBackgroundPointer);
  pad.addEventListener('pointercancel', endBackgroundPointer);

  // ===== end Tools dock and floating tool windows =====


  // ===== end Teaching Table additions =====

  afterMathliveReady(async () => {
    applyMathSize();
    applyBackgroundScale();
    if (!load()) { makeRow(''); setMode('plain'); }
    setActive(document.querySelector('math-field'));
    await refreshToolsFromAppMenu();
    renderDock();
    restoreOpenTools();

    document.querySelectorAll('[data-insert]').forEach(button => {
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        insertText(button.dataset.insert);
      });
    });
    document.querySelectorAll('[data-latex]').forEach(button => {
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        insertLatex(button.dataset.latex);
      });
    });
    document.querySelectorAll('[data-space]').forEach(button => {
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        insertSpace();
      });
    });
    document.querySelectorAll('[data-cmd]').forEach(button => {
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        command(button.dataset.cmd);
      });
    });
    document.getElementById('fracBtn').addEventListener('pointerdown', event => {
      event.preventDefault();
      insertFraction();
    });
    document.getElementById('plainBtn').addEventListener('pointerdown', event => { event.preventDefault(); setMode('plain'); });
    document.getElementById('linedBtn').addEventListener('pointerdown', event => { event.preventDefault(); setMode('lined'); });
    document.getElementById('gridBtn').addEventListener('pointerdown', event => { event.preventDefault(); setMode('grid'); });
    document.getElementById('worksheetBtn').addEventListener('pointerdown', event => {
      event.preventDefault();
      // If we have a worksheet cached but are in another paper mode, just switch back.
      // Otherwise open the source modal (QR + file picker).
      if (worksheetDataUrl && currentMode !== 'worksheet') {
        setMode('worksheet');
      } else {
        openWorksheetModal();
      }
    });
    document.getElementById('smallTextBtn').addEventListener('pointerdown', event => { event.preventDefault(); changeMathSize(-4); });
    document.getElementById('bigTextBtn').addEventListener('pointerdown', event => { event.preventDefault(); changeMathSize(4); });
    document.getElementById('worksheetSmallBtn').addEventListener('pointerdown', event => { event.preventDefault(); changeCurrentBackgroundScale(-0.1); });
    document.getElementById('worksheetBigBtn').addEventListener('pointerdown', event => { event.preventDefault(); changeCurrentBackgroundScale(0.1); });
    document.querySelectorAll('[data-alg]').forEach(button => {
      button.addEventListener('pointerdown', event => { event.preventDefault(); makeAlgoBlock(button.dataset.alg); });
    });
    document.getElementById('clearBtn').addEventListener('pointerdown', event => {
      event.preventDefault();
      // Clear annotations and worksheet, return to plain paper.
      [...stage.children].forEach(el => { if (el !== worksheetImg) el.remove(); });
      worksheetDataUrl = null;
      worksheetScale = 1;
      backgroundScale = 1;
      applyWorksheetScale();
      applyBackgroundScale();
      worksheetImg.src = '';
      worksheetImg.classList.add('hidden');
      setMode('plain');
      makeRow('');
      setActive(document.querySelector('math-field'));
      saveNow();
    });

  // Physical keyboard → algorithm cell input
  window.addEventListener('keydown', (e) => {
    if (!activeCell) return;
    // Don't intercept if a math-field has focus
    if (document.activeElement && document.activeElement.tagName === 'MATH-FIELD') return;
    if (/^[0-9.]$/.test(e.key)) {
      e.preventDefault();
      insertIntoCell(e.key);
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      backspaceCell();
    } else if (e.key === 'Tab' || e.key === 'ArrowRight') {
      e.preventDefault();
      moveCell(1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      moveCell(-1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      // Move to first cell of next row in the algorithm block
      const block = activeCell.closest('.algo-block');
      if (!block) return;
      const rows = [...block.querySelectorAll('.algo-row, .work-row')];
      const currentRow = activeCell.closest('.algo-row, .work-row');
      const currentIdx = rows.indexOf(currentRow);
      if (currentIdx >= 0 && currentIdx < rows.length - 1) {
        const nextCells = rows[currentIdx + 1].querySelectorAll('.digit-cell');
        if (nextCells.length) setActiveCell(nextCells[nextCells.length - 1]);
      }
    }
  });

  });
})();
