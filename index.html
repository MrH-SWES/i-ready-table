<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>  <style>
    :root {
      --paper: #f7efdc;
      --ink: #1d1d1f;
      --muted: rgba(29,29,31,.58);
      --line: rgba(35, 56, 96, 0.26);

      --button: #fffefa;

      --accent: #2e5894;
      --danger: #9d3a36;
      --shadow: 0 18px 40px rgba(20, 16, 8, 0.32);
      --math-size: 44px;
      --side-width: clamp(190px, 21vw, 285px);

      /* Cabinet body — dark graphite metal */
      --cabinet:        #2a2722;
      --cabinet-edge:   #15120e;
      --cabinet-up:     #3a3530;
      --cabinet-down:   #1c1915;
      --cabinet-rim:    rgba(255,255,255,0.06);

      /* Brushed metal — for buttons, infrastructure */

      --metal-mid:      #cbc5b9;
      --metal-down:     #a39d92;
      --metal-edge:     #5a554e;
      --metal-hi:       rgba(255,255,255,0.55);
      --metal-shadow:   rgba(0,0,0,0.30);

      /* Enamel — saturated math-object colors */
      --enamel-blue:    #28528c;
      --enamel-blue-up: #4a78b4;
      --enamel-blue-dn: #173c70;
      --enamel-cream:   #f1d99c;
      --enamel-cream-up:#fbe9b8;
      --enamel-cream-dn:#c9a85e;
      --enamel-rust:    #a8421d;
      --enamel-rust-up: #c25e34;
      --enamel-rust-dn: #6e2a10;
      --enamel-ochre:   #b8893e;
      --enamel-ochre-up:#d4a55c;
      --enamel-ochre-dn:#7d5a1e;
      --enamel-forest:  #2f5d3f;
      --enamel-forest-up:#4a7d5b;
      --enamel-forest-dn:#1c3e26;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Lexend", ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.85), transparent 40%),
        radial-gradient(rgba(0,0,0,0.055) 1.1px, transparent 1.1px),
        #F2EFE6;
      background-size: auto, 28px 28px, auto;
      overflow: hidden;
      letter-spacing: -0.005em;
    }
    .shell {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--side-width);
      gap: 10px;
      padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
    }
    .pad-wrap {
      min-height: 0;
      background: rgba(255, 253, 247, 0.86);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 36px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
      border-radius: 24px;
      padding: 10px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #pad-frame {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      border-radius: 14px;

      box-shadow: inset 0 2px 4px rgba(0,0,0,0.35);
    }
    #pad {
      height: 100%;
      overflow: auto;
      border-radius: 14px;
      border: none;
      background-color: #FFFDF7;
      padding: 18px;
      scroll-padding-bottom: 80px;
    }
    #pad {
      --paper-line-size: 48px;
      --paper-grid-size: 24px;
    }
    #pad.lined {
      background-image: linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(var(--paper-line-size) - 1px),
        var(--line) var(--paper-line-size)
      );
      background-size: 100% var(--paper-line-size);
    }
    #pad.grid {
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: var(--paper-grid-size) var(--paper-grid-size);
    }
    .row {
      min-height: calc(var(--math-size) * 1.28);
      margin: 0 0 8px 0;
      padding: 5px 8px;
      border-radius: 16px;
      display: flex;
      align-items: center;

      border: 2px solid transparent;
    }
    .row.active {
      background: rgba(255, 242, 179, .42);
      border-color: rgba(215, 182, 81, .52);
    }
    math-field {
      width: 100%;
      min-height: calc(var(--math-size) * 1.12);
      border: 0;
      outline: none;
      background: transparent;
      font-size: var(--math-size);
      --caret-color: #1b4f9b;
      --selection-background-color: rgba(74, 130, 210, .25);
      --contains-highlight-background-color: transparent;
    }
    math-field::part(menu-toggle),
    math-field::part(virtual-keyboard-toggle) { display: none; }

    .side {
      min-height: 0;
      overflow: auto;
      background: rgba(255, 253, 247, 0.86);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 36px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
      border-radius: 24px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 0;
      line-height: .94;
      padding: 4px 3px 7px;
      user-select: none;
    }
    .brand .math-things {

      font-weight: 900;
      letter-spacing: -0.055em;
      color: #1D1D1F;
    }
    .brand .pad-name {
      font-size: 13px;
      font-weight: 600;
      color: #86868B;
      letter-spacing: -0.02em;
    }
    .tools.paper-modes {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }
    .keys {
      display: grid;
      gap: 6px;
      align-content: start;
    }
    .keys.digit-pad { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .keys.op-pad { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .keys.edit-pad { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .utility {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      margin-top: 2px;
    }
    button {
      border: 1px solid rgba(0,0,0,0.13);
      background: linear-gradient(180deg, #ffffff 0%, #f0eff0 100%);
      color: #1D1D1F;
      border-radius: 10px;
      min-height: 42px;
      height: 42px;
      font-family: inherit;
      font-size: 19px;
      font-weight: 600;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -1px 0 rgba(0,0,0,0.07),
        0 2px 0 rgba(0,0,0,0.16),
        0 3px 8px rgba(0,0,0,0.07);
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding: 0 4px;
      display: inline-grid;
      place-items: center;
    }
    button:active {
      transform: translateY(1px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -1px 0 rgba(0,0,0,0.07),
        0 0px 0 rgba(0,0,0,0.16),
        0 1px 3px rgba(0,0,0,0.07);
    }
    button.is-on {
      background: linear-gradient(180deg, #e8f0ff 0%, #ccdaff 100%);
      border-color: rgba(46, 88, 148, 0.45);
      color: #1a3a7a;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.7),
        0 2px 0 rgba(20,50,120,0.18),
        0 3px 8px rgba(46,88,148,0.12);
    }
    button.danger {
      color: #9d3a36 !important;
    }
    .fraction-icon {
      display: inline-grid;
      grid-template-rows: 1fr 2px 1fr;
      align-items: center;
      justify-items: center;
      width: 32px;
      height: 32px;
      line-height: 1;
      font-size: 14px;
      font-weight: 800;
      font-style: italic;
    }
    .fraction-icon .bar { width: 26px; height: 2.5px; background: currentColor; border-radius: 3px; }
    .frac-key {
      background: linear-gradient(180deg, #deeeff 0%, #5a9ef0 55%, #2060c8 100%) !important;
      border-color: rgba(20, 60, 140, 0.55) !important;
      color: #ffffff !important;
    }

    .util {
      min-height: 32px;
      height: 32px;
      font-size: 13px;
      border-radius: 8px;
    }
    .paper-icon {
      display: inline-block;
      width: 21px;
      height: 25px;
      border: 2px solid currentColor;
      border-radius: 4px;
      opacity: .9;
      position: relative;
    }
    .paper-icon.lined::before {
      content: "";
      position: absolute;
      left: 4px; right: 4px; top: 6px; height: 2px;
      background: currentColor;
      box-shadow: 0 6px 0 currentColor, 0 12px 0 currentColor;
    }
    .paper-icon.grid {
      background-image:
        linear-gradient(to right, currentColor 1px, transparent 1px),
        linear-gradient(to bottom, currentColor 1px, transparent 1px);
      background-size: 7px 7px;
      background-position: 3px 3px;
    }
    .trash-icon {
      display: inline-block;
      width: 21px;
      height: 23px;
      border: 2px solid currentColor;
      border-top: 0;
      border-radius: 0 0 5px 5px;
      position: relative;
      margin-top: 6px;
    }
    .trash-icon::before {
      content: "";
      position: absolute;
      left: -3px; right: -3px; top: -7px; height: 3px;
      background: currentColor;
      border-radius: 3px;
    }
    .trash-icon::after {
      content: "";
      position: absolute;
      left: 7px; top: -12px; width: 7px; height: 4px;
      border: 2px solid currentColor;
      border-bottom: 0;
      border-radius: 4px 4px 0 0;
    }


    .algorithms {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }
    .alg-btn {
      min-height: 52px;
      height: 52px;
      font-size: 22px;
      background: linear-gradient(180deg, #fff3d6 0%, #ffd97a 55%, #e6b84a 100%) !important;
      border-color: rgba(140, 100, 0, 0.45) !important;
      color: #3a2800 !important;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.7),
        0 2px 0 rgba(100,70,0,0.28),
        0 4px 10px rgba(140,100,0,0.14) !important;
    }
    .alg-btn:active {
      transform: translateY(1px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.7),
        0 0px 0 rgba(100,70,0,0.28),
        0 1px 3px rgba(140,100,0,0.14) !important;
    }
    .alg-symbol {
      position: relative;
      display: inline-block;
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      padding: 2px 6px 10px;
    }
    .alg-symbol::after {
      content: "";
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 2px;
      height: 3px;
      background: currentColor;
      opacity: 0.85;
      border-radius: 1px;
    }
    .alg-symbol-div {
      font-size: 32px;
      padding: 0 4px;
    }
    .alg-symbol-div::after { display: none; }
    .algo-block {
      display: inline-block;
      margin: 10px 0 16px 8px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 242, 179, .22);
      border: 2px solid transparent;
      vertical-align: top;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 850;
      font-size: calc(var(--math-size) * .72);
      color: var(--ink);
    }
    .algo-block.active { border-color: rgba(215, 182, 81, .62); }
    .algo-row {
      display: grid;
      grid-template-columns: 1.1em repeat(var(--algo-cols, 5), 1.05em);
      gap: .12em;

      justify-content: end;
      min-height: 1.25em;
    }
    .algo-row.answer, .algo-row.partial { border-top: .075em solid currentColor; margin-top: .1em; padding-top: .1em; }
    .algo-row.carry {
      min-height: .86em;

      margin-bottom: -.12em;
    }
    .algo-row.carry .digit-cell {

    }
    .algo-row.borrow .digit-cell {
      color: var(--danger);
    }
    .opcell { text-align: center; opacity: .95; }
    .digit-cell {
      min-width: 1.05em;
      min-height: 1.18em;
      display: inline-grid;
      place-items: center;
      border-radius: .18em;
      outline: none;
      background: rgba(255,255,255,.08);
    }
    .digit-cell.active {
      background: rgba(54, 95, 157, .16);
      box-shadow: inset 0 -0.08em 0 #365f9d;
    }
    .longdiv-block { min-width: 10em; }
    .longdiv-quotient {
      display: grid;
      grid-template-columns: 2.5em repeat(var(--algo-cols, 5), 1.05em);
      gap: .12em;
      margin-left: .35em;
      margin-bottom: .08em;
    }
    .longdiv-main {
      display: grid;
      grid-template-columns: 2.4em repeat(var(--algo-cols, 5), 1.05em);
      gap: .12em;
      align-items: stretch;
    }
    .divisor-cells { display: grid; grid-template-columns: repeat(2, 1.05em); gap: .12em; align-items: center; }
    .dividend-cells {
      grid-column: 2 / -1;
      display: grid;
      grid-template-columns: repeat(var(--algo-cols, 5), 1.05em);
      gap: .12em;
      border-top: .075em solid currentColor;
      border-left: .075em solid currentColor;
      border-radius: .16em 0 0 0;
      padding-left: .18em;
    }
    .work-row {
      display: grid;
      grid-template-columns: 2.5em repeat(var(--algo-cols, 5), 1.05em);
      gap: .12em;
      min-height: 1.25em;
      margin-left: .35em;
    }

    /* ----- Teaching Table additions ----- */
    #pad { position: relative; }
    #stage {
      position: relative;
      min-height: 100%;
    }
    #worksheet-img {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      border-radius: 6px;
      margin: 0 0 14px 0;
      box-shadow: 0 1px 0 rgba(0,0,0,.06);
    }
    #worksheet-img.hidden { display: none; }
    #pad.worksheet { background-image: none; }
    #pad.worksheet #stage { cursor: crosshair; }
    #pad.worksheet #stage .row, #pad.worksheet #stage .algo-holder { cursor: default; }

    .row { position: relative; }
    .row.positioned {
      position: absolute;
      margin: 0;
      padding: 3px 8px 3px 22px;
      background: transparent;
      border: 1.5px solid transparent;
      border-radius: 12px;
      box-shadow: none;
      z-index: 10;
      max-width: 90%;
      min-width: 130px;
      width: max-content;
      transition: background-color 130ms ease, border-color 130ms ease, box-shadow 130ms ease;
    }
    .row.positioned math-field {
      width: auto;
      min-width: 110px;
    }
    .row.positioned:hover {
      background: rgba(255, 253, 247, 0.62);
      border-color: rgba(150, 140, 120, 0.28);
    }
    .row.positioned.active {
      background: rgba(255, 245, 200, 0.94);
      border-color: rgba(215, 182, 81, 0.72);
      box-shadow: 0 5px 14px rgba(40, 34, 24, 0.14);
      z-index: 20;
    }
    .row-grip {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 22px;
      display: none;
      cursor: grab;
      touch-action: none;
      border-radius: 12px 0 0 12px;
      opacity: 0;
      transition: opacity 130ms ease;
    }
    .row-grip::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 18px;
      background-image: radial-gradient(circle, rgba(40,34,24,0.55) 1.2px, transparent 1.4px);
      background-size: 4px 5px;
      background-repeat: repeat-y;
    }
    .row.positioned .row-grip { display: block; }
    .row.positioned:hover .row-grip,
    .row.positioned.active .row-grip { opacity: 1; }
    .row-grip:active { cursor: grabbing; }

    .algo-holder { position: relative; }
    .algo-holder.positioned {
      position: absolute;
      z-index: 10;
      transition: filter 130ms ease;
    }
    .algo-holder.positioned .algo-block {
      margin: 0;
      padding-left: 30px;
      background: rgba(255, 253, 247, 0.0);
      border: 1.5px solid transparent;
      border-radius: 14px;
      box-shadow: none;
      transition: background-color 130ms ease, border-color 130ms ease, box-shadow 130ms ease;
    }
    .algo-holder.positioned:hover .algo-block {
      background: rgba(255, 253, 247, 0.7);
      border-color: rgba(150, 140, 120, 0.28);
    }
    .algo-holder.positioned.active .algo-block {
      background: rgba(255, 245, 200, 0.94);
      border-color: rgba(215, 182, 81, 0.72);
      box-shadow: 0 5px 14px rgba(40, 34, 24, 0.14);
      z-index: 20;
    }
    .algo-grip {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 24px;
      display: none;
      cursor: grab;
      touch-action: none;
      border-radius: 12px 0 0 12px;
      opacity: 0;
      transition: opacity 130ms ease;
      z-index: 30;
    }
    .algo-grip::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 22px;
      background-image: radial-gradient(circle, rgba(40,34,24,0.55) 1.2px, transparent 1.4px);
      background-size: 4px 5px;
      background-repeat: repeat-y;
    }
    .algo-holder.positioned .algo-grip { display: block; }
    .algo-holder.positioned:hover .algo-grip,
    .algo-holder.positioned.active .algo-grip { opacity: 1; }
    .algo-grip:active { cursor: grabbing; }

    /* Worksheet upload icon */
    .worksheet-icon {
      display: inline-block;
      width: 21px;
      height: 25px;
      border: 2px solid currentColor;
      border-radius: 4px;
      opacity: .9;
      position: relative;
    }
    .worksheet-icon::before {
      content: "";
      position: absolute;
      left: 3px; right: 3px; top: 5px;
      height: 2px;
      background: currentColor;
      box-shadow: 0 4px 0 currentColor, 0 8px 0 currentColor, 0 12px 0 currentColor;
      opacity: .85;
    }
    .worksheet-icon::after {
      content: "";
      position: absolute;
      top: -3px; right: -3px;
      width: 8px; height: 8px;
      background: var(--metal-mid);
      border: 2px solid currentColor;
      border-radius: 50%;
    }

    /* Drop zone overlay */
    #drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(54, 95, 157, 0.18);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
    }
    #drop-overlay.show { display: flex; }
    #drop-overlay .label {
      font-size: 32px;
      font-weight: 950;
      color: var(--accent);
      background: rgba(255, 253, 247, 0.94);
      padding: 24px 36px;
      border-radius: 22px;
      border: 3px dashed var(--accent);
      letter-spacing: -0.02em;
    }
    /* ----- end Teaching Table additions ----- */

    /* ===== Worksheet source modal (QR + file picker) ===== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(40, 34, 24, 0.42);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1500;
      padding: 24px;
    }
    .modal-backdrop.show { display: flex; }
    .modal-card {
      background: linear-gradient(135deg, #fffdf6 0%, #f7f1e0 100%);
      border-radius: 28px;
      padding: 28px 30px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 28px 64px rgba(40, 34, 24, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
      position: relative;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 950;
      letter-spacing: -0.04em;
      margin: 0 0 4px;
      color: #1d1d1f;
    }
    .modal-sub {
      font-size: 15px;
      color: rgba(29, 29, 31, 0.62);
      font-weight: 700;
      margin: 0 0 18px;
    }
    .qr-frame {
      display: inline-block;
      padding: 14px;

  function normalizedToolPath(url) {
    try {
      return new URL(url, window.location.href).pathname.replace(/\/+$/, '/');
    } catch (ignored) {
      return String(url || '');
    }
  }

  function categoryKey(label) {
    const value = String(label || '').trim().toLowerCase();
    if (value.startsWith('core')) return 'CORE';
    if (value.startsWith('concept')) return 'CONCEPT';
    if (value.startsWith('bridge')) return 'BRIDGE';
    if (value.startsWith('algorithm')) return 'ALGORITHM';
    return 'EXPLORATION';
  }

  function guessToolIcon(name) {
    const n = String(name || '').toLowerCase();
    if (n.includes('division')) return '÷';
    if (n.includes('multiplication')) return '×';
    if (n.includes('fraction')) return '½';
    if (n.includes('number line')) return '━●━';
    if (n.includes('number bond')) return '○';
    if (n.includes('array')) return '▦';
    if (n.includes('place value') || n.includes('ten frame')) return '▥';
    if (n.includes('measure')) return '📏';
    if (n.includes('geo') || n.includes('euclid') || n.includes('rectangle')) return '△';
    if (n.includes('dial')) return '◷';
    if (n.includes('balance')) return '⚖';
    if (n.includes('prime')) return '◆';
    return '◇';
  }

  async function refreshToolsFromAppMenu() {
    try {
      const response = await fetch('https://mrh-swes.github.io/math-things/index.html', { cache: 'no-store' });
      if (!response.ok) throw new Error(`app menu returned ${response.status}`);
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const overrideByPath = new Map(
        TOOL_OVERRIDES.map(tool => [normalizedToolPath(tool.url), tool])
      );
      const live = [];

      doc.querySelectorAll('.app-card').forEach(card => {
        const rawHref = card.getAttribute('href');
        if (!rawHref) return;

        const absolute = new URL(rawHref, new URL('https://mrh-swes.github.io/math-things/', window.location.href));
        const parts = absolute.pathname.split('/').filter(Boolean);
        const slug = parts[parts.length - 1] || '';
        if (!slug || slug === 'teaching-table') return;

        const name = card.querySelector('.app-name')?.textContent?.trim() || slug;
        const family = card.querySelector('.app-family')?.textContent?.trim() || 'Exploration';
        const domain = categoryKey(family);
        const override = overrideByPath.get(absolute.pathname.replace(/\/+$/, '/'));
        const id = override?.id || slug.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase();

        live.push({
          id,
          domain,
          name,
          url: absolute.href,
          icon: override?.icon || guessToolIcon(name),

          h: override?.h || 480,

  function makeRow(latex = '') {
